name: Consumer compat

# Installs the packed libs into fresh Angular apps and builds them, the way a
# consumer would. Slow (a full `ng new` + install per row), so it runs nightly,
# on demand, and on PRs that touch what a consumer installs.
#
# Fixture rows are required checks (e.g. angular-22-full), so the workflow
# starts on every PR: a path filter on the trigger would leave those checks
# pending forever on a PR that does not touch the paths. The `changes` job
# decides instead, from the same input list the schematics-consumer job
# reads (scripts/schematics-consumer-inputs.mjs), so a build-only PR runs the
# rows too; on an unrelated PR every fixture row reports success without
# running its slow steps.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: consumer-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Decide whether a consumer-facing path changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/schematics-consumer-inputs.mjs --base "$BASE_SHA" --workflow consumer-compat

  pack:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build all libraries
        run: npm run build:libs
      - name: Pack and lint the tarballs
        run: npm run pack:check
      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: .consumer-compat/tarballs/*.tgz
          retention-days: 1

  fixture:
    needs: [changes, pack]
    # Runs even when pack was skipped, so every matrix row reports its check
    # under its expanded name; a skipped matrix job would report the
    # unexpanded name and leave the required check pending.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest version the peer range (>=21.1.0 <23.0.0) allows, without
          # any optional peer.
          - { angular: '21.1.0', variant: minimal }
          - { angular: '21', variant: full }
          - { angular: '21', variant: zone }
          - { angular: '21', variant: ssr }
          # Highest major the peer range allows.
          - { angular: '22', variant: full }
          - { angular: '22', variant: minimal }
          # The required schematics-consumer job runs this variant on 21
          # without a registry download on the recommended preset; these rows
          # add the leg where an older published core must be replaced by the
          # packed one in the same ng add, and the leg where a real
          # ng update @cngx/core moves the older release of the package
          # group to the packed one, and run them on the full preset, which
          # places the feedback outlets and adds ng test. Standalone apps
          # only, so the 22 row needs no NgModule outlets.
          - { angular: '21', variant: schematics, args: '--stale-core previous --preset full' }
          - { angular: '22', variant: schematics, args: '--stale-core previous --preset full' }
          # The documented path on a fresh app with no @angular/cdk: one
          # ng add @cngx/core must install the CDK on the app's own major
          # (npm alone would fetch the newest CDK the peers allow), write the
          # starter over the scaffold of that CLI major, pass ng test and
          # plan nothing on a second ng add.
          - { angular: '21', variant: onboarding, args: '--preset full' }
          - { angular: '22', variant: onboarding, args: '--preset full' }
          # The same path on an ng new --standalone=false app with routing:
          # the outlets go into the root NgModule and the stock spec gets
          # the outlet classes and the providers, so ng test still passes.
          # CLI 21 only: from 22.2 the stock NgModule app fails ng test on
          # its own, and ng add leaves the outlets out there.
          - { angular: '21', variant: ngmodule, args: '--preset full' }
    name: angular-${{ matrix.angular }}-${{ matrix.variant }}
    steps:
      - name: Skip, no consumer-facing path changed
        if: needs.changes.outputs.relevant != 'true'
        run: echo "No consumer-facing path changed in this PR; the fixture build is skipped."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.relevant == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.relevant == 'true'
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: npm ci
      # npm 10.9 (bundled with Node 22) crashes with "reading 'edgesOut'" on a
      # plain install of a fresh Angular 21 app; npm 11 installs it cleanly.
      - name: Use npm 11 for the fixture install
        if: needs.changes.outputs.relevant == 'true'
        run: npm install -g npm@11
      - name: Install Playwright chromium
        if: needs.changes.outputs.relevant == 'true'
        run: npx playwright install --with-deps chromium
      - name: Download tarballs
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: .consumer-compat/tarballs
      - name: Build the fixture app
        if: needs.changes.outputs.relevant == 'true'
        run: node scripts/consumer-fixture.mjs --angular ${{ matrix.angular }} --variant ${{ matrix.variant }} ${{ matrix.args }}
