name: E2E nightly

# Cross-browser coverage for the root e2e suite. The push/PR gate in ci.yml runs
# it on chromium only, to keep PR latency and cost down; this workflow runs the
# root e2e suite across chromium + firefox + webkit, once a night and on demand.
# It is a diagnostic, not a required check (like the cli rows in
# consumer-compat.yml), so a firefox- or webkit-only failure never blocks a PR.
#
# Root suite only, deliberately: the examples suite is chromium-tuned (clipboard
# grantPermissions, colour serialisation, geometry tolerances and console timing
# all differ on firefox/webkit), so running it cross-browser needs a dedicated
# hardening pass, tracked separately. ci.yml already covers the examples suite on
# chromium.
#
# Build once (libs + docs:json + examples:generate), upload build-output, then fan
# out per browser - mirrors the ci.yml build -> e2e-shard artifact pattern. Node
# from .nvmrc. Runs at 04:00 UTC, one hour after consumer-compat (03:00), so the
# two scheduled workflows do not contend for runners.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single build pass, copied from ci.yml's build job: compile the libs,
  # generate the compodoc JSON and the example feature components once, then hand
  # them to the per-browser jobs as an artifact.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Build all libraries
        run: npm run build:libs
      - name: Generate compodoc JSON
        run: npm run docs:json
      - name: Generate examples components
        run: npm run examples:generate
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            .compodoc
            examples/src/app/features
            examples/src/app/app.routes.ts
            examples/src/app/_routes-meta.ts
          retention-days: 1
          include-hidden-files: true

  # The root e2e suite, one job per browser. firefox/webkit need their system
  # deps on the runner image (chromium needs none), so setup-playwright gets
  # with-deps: true here.
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: e2e (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ matrix.browser }}
          with-deps: 'true'
      - name: e2e suite
        run: npm run e2e -- --project=${{ matrix.browser }}
