name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-

      # Keyed on the lockfile so the cache invalidates when the pinned
      # @playwright/test version changes - the browser build the geometry
      # specs (and the timeline e2e) drive Chromium with.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Build all libraries
        run: npm run build:libs

      - name: Generate compodoc JSON
        run: npm run docs:json

      - name: Generate examples components
        run: npm run examples:generate

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build examples app
        run: npm run build:examples

      # Scoped to one spec on one browser by design. The repo has ~30 e2e
      # specs CI has never run; adopting them here would make this step the
      # owner of their current health and would be the fastest route to
      # having it disabled. This one guards the timeline row raster, which
      # no unit test can observe: the grid lives inside @layer and @scope,
      # neither of which jsdom's CSSOM parses.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Geometry specs run in the same job as the unit tests - same pipeline,
      # a different environment. CI sets CI=1, so the vitest browser provider
      # runs Chromium headless with no flag. A geometry regression fails the PR.
      - name: Run geometry specs
        run: npm run test:geometry

      - name: Timeline layout e2e
        run: npx playwright test e2e/timeline-layout.spec.ts --project=chromium
