name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# Cancel a superseded run when a PR gets a new push. Main pushes are never
# cancelled (they mark the release history), so gate the cancel on PR events.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single build pass: produce the lib dist, the compodoc JSON and the
  # generated example feature components once, then hand them to every
  # downstream job as an artifact. This is the only job that compiles the
  # libraries; lint/test/geometry/e2e/build-examples fan out in parallel and
  # each restores this exact output, so their environment matches the old
  # serial pipeline byte-for-byte.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build all libraries
        run: npm run build:libs

      - name: Generate compodoc JSON
        run: npm run docs:json

      - name: Generate examples components
        run: npm run examples:generate

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            .compodoc
            examples/src/app/features
            examples/src/app/app.routes.ts
            examples/src/app/_routes-meta.ts
          retention-days: 1
          include-hidden-files: true

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Lint
        run: npm run lint

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run tests
        run: npm run test
      - name: Run script and eslint-rule tests
        run: npm run test:scripts

  # Packs the built libs as the publish would and lints the tarballs with
  # publint and are-the-types-wrong. The slow consumer-app matrix lives in
  # consumer-compat.yml.
  pack-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Pack and lint the tarballs
        run: npm run pack:check

  geometry:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Install Playwright chromium
        uses: ./.github/actions/setup-playwright
      # Geometry specs run in the browser-mode vitest provider. CI sets CI=1,
      # so Chromium runs headless. A geometry regression fails the PR.
      - name: Run geometry specs
        run: npm run test:geometry

  # The root suite is not route-scoped, so every pull request runs all of it,
  # split by test across a fixed matrix.
  e2e-shard:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Install Playwright chromium
        uses: ./.github/actions/setup-playwright
      # The Playwright webServer boots `ng serve examples`; it serves the
      # generated feature components restored from the build artifact. Route-drift
      # specs with no migrated example are test.fixme-quarantined in-file; the
      # whole remaining suite gates the PR.
      - name: e2e suite
        run: npm run e2e -- --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The required check. It also runs when build fails, so the check turns red
  # instead of staying pending; the suite has no scope, hence the fixed
  # "success all" arguments.
  e2e:
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the shards
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: node scripts/e2e-gate.mjs success all "$SHARDS"

  # Which example demos a pull request reaches through the import graph
  # (scripts/e2e-scope.mjs); the two example suites run only their specs and
  # routes, on as many shards as the selection needs. A push runs everything.
  e2e-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      specs: ${{ steps.scope.outputs.specs }}
      grep: ${{ steps.scope.outputs.grep }}
      examples-shards: ${{ steps.scope.outputs.examples-shards }}
      sweep-shards: ${{ steps.scope.outputs.sweep-shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Decide the e2e scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/e2e-scope.mjs --base "$BASE_SHA"
          else
            node scripts/e2e-scope.mjs --all
          fi

  examples-e2e-shard:
    needs: [build, e2e-scope]
    if: needs.e2e-scope.outputs.mode != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-scope.outputs.examples-shards) }}
    name: examples-e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Install Playwright chromium
        uses: ./.github/actions/setup-playwright
      # The examples suite drives its smoke matrices off examples/src/app/_routes-meta.ts,
      # which is gitignored and regenerated by the Playwright webServer's
      # `ng serve examples`. Quarantined specs are registered in
      # .internal/architektur/examples-e2e-accepted-debt.md, capped at 3.
      # SPECS is empty on a full run and a space-separated list of spec files
      # otherwise; a shard the filters leave empty passes. --fully-parallel
      # splits the shards by test instead of by file, which evens them out;
      # each shard runs two workers (examples/playwright.config.ts).
      - name: examples-e2e suite
        env:
          SPECS: ${{ needs.e2e-scope.outputs.specs }}
        run: npm run test:e2e:examples -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --fully-parallel --pass-with-no-tests $SPECS

  # The required check: green when every shard passed, or when the pull
  # request reaches no example demo.
  examples-e2e:
    needs: [e2e-scope, examples-e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the shards
        env:
          SCOPE: ${{ needs.e2e-scope.result }}
          MODE: ${{ needs.e2e-scope.outputs.mode }}
          SHARDS: ${{ needs.examples-e2e-shard.result }}
        run: node scripts/e2e-gate.mjs "$SCOPE" "$MODE" "$SHARDS"

  console-sweep-shard:
    needs: [build, e2e-scope]
    if: needs.e2e-scope.outputs.mode != 'none'
    runs-on: ubuntu-latest
    # 8.5 minutes locally for every route; the cap stops a hung server or page
    # long before the 6-hour default.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-scope.outputs.sweep-shards) }}
    name: console-sweep (${{ matrix.shard }}/${{ strategy.job-total }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Install Playwright chromium
        uses: ./.github/actions/setup-playwright
      # Loads every route in examples/src/app/_routes-meta.ts once and fails on a
      # console warning, console error or page error not on the capped allowlist
      # in examples/e2e-sweep/console-allowlist.ts. GREP is empty on a full run
      # and names the selected routes (and the allowlist checks) otherwise.
      - name: console sweep
        env:
          GREP: ${{ needs.e2e-scope.outputs.grep }}
        run: npm run test:e2e:sweep -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --pass-with-no-tests ${GREP:+--grep "$GREP"}

  console-sweep:
    needs: [e2e-scope, console-sweep-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the shards
        env:
          SCOPE: ${{ needs.e2e-scope.result }}
          MODE: ${{ needs.e2e-scope.outputs.mode }}
          SHARDS: ${{ needs.console-sweep-shard.result }}
        run: node scripts/e2e-gate.mjs "$SCOPE" "$MODE" "$SHARDS"

  build-examples:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      # `npm run build:examples` regenerates docs:json + feature components via
      # its prebuild hook, so the production build validates against a fresh tree.
      - name: Build examples app
        run: npm run build:examples
      # Reuses the production build above: fails when dev-only code reaches the
      # bundle - a `cngx-dev:` marker, a hand-written debugName, the code of a
      # cngxDevWarn / cngxDevError call or of a dev-only CngxRuntimeError, or the
      # error docs URL. Every needle must also be present in the library build,
      # and while source constructs a code-only CngxRuntimeError, one such code
      # must reach the bundle (liveness), so a clean scan is not vacuous.
      - name: Check production bundle for dev-only code
        run: node scripts/devtools-prod-strip-check.mjs

  # The libs peer on Angular >=21.1.0 <23.0.0, but the workspace builds and
  # publishes with one Angular 21. These rows move a throwaway copy of the
  # workspace onto the edges of that range with scripts/toolchain-overlay.mjs,
  # then build every lib and run every lib's unit tests there, so the same
  # sources are proven on each edge:
  # - 22: the whole toolchain on exactly Angular 22.2.3 (TypeScript 6,
  #   ng-packagr 22); tools on their own version line and TypeScript take
  #   their newest release published by @angular/core 22.2.3, so the run never
  #   drifts on its own. Move the version on purpose to pick up a newer 22.
  # - 21.1: the framework pinned to exactly 21.1.0, the peer range floor, with
  #   the workspace's own build tooling from the lockfile.
  # The overlay installs itself (no npm ci first). Node 24 from .nvmrc:
  # Angular 22 needs ^24.15.0 on the 24 line, and 21.1 accepts >=24.0.0.
  # Each lib is its own step, so one red lib does not hide the next.
  angular-libs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: '22', overlay: '--angular 22.2.3' }
          - { label: '21.1', overlay: '--angular 21.1.0 --framework-only' }
    name: angular-${{ matrix.label }}-libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Move the workspace onto Angular ${{ matrix.label }}
        run: node scripts/toolchain-overlay.mjs ${{ matrix.overlay }}
      - name: Record the resolved dependency tree
        if: ${{ !cancelled() }}
        run: npm ls --all > npm-ls.txt || true
      - name: Upload the resolved dependency tree
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: angular-${{ matrix.label }}-dependency-tree
          path: |
            npm-ls.txt
            package.json
            package-lock.json
          retention-days: 14
      - name: zone.js stays unresolvable
        run: npx vitest run --config scripts/vitest.config.mjs scripts/__tests__/zone-unresolvable.test.mjs
      - name: Build all libraries
        run: npm run build:libs
      - name: Test utils
        run: npx ng test utils --watch=false
      - name: Test core
        if: ${{ !cancelled() }}
        run: npx ng test core --watch=false
      - name: Test forms
        if: ${{ !cancelled() }}
        run: npx ng test forms --watch=false
      - name: Test ui
        if: ${{ !cancelled() }}
        run: npx ng test ui --watch=false
      - name: Test common
        if: ${{ !cancelled() }}
        run: npx ng test common --watch=false
      - name: Test data-display
        if: ${{ !cancelled() }}
        run: npx ng test data-display --watch=false
      - name: Test interop
        if: ${{ !cancelled() }}
        run: npx ng test interop --watch=false
      - name: Test schematics
        if: ${{ !cancelled() }}
        run: npm run test:schematics

  # The standalone @cngx/eslint-plugin package lives under packages/ (no npm
  # workspace), so it carries its own package-lock and needs its own install
  # in addition to the root one. It does not consume the Angular build output,
  # so it runs independently of `build`.
  eslint-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci
      - name: Install eslint-plugin dependencies
        run: npm ci
        working-directory: packages/eslint-plugin
      - name: Build eslint-plugin
        run: npm run build:eslint-plugin
      - name: Test eslint-plugin
        run: npm run test:eslint-plugin

  # The @cngx/mcp package queries the compodoc documentation.json, so unlike
  # eslint-plugin it declares needs: build and restores the .compodoc artifact
  # the build job already produced rather than regenerating docs:json here. Like
  # eslint-plugin it lives under packages/ (no npm workspace), so it carries its
  # own package-lock and a package-local install on top of the root one.
  mcp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci
      - name: Install mcp dependencies
        run: npm ci
        working-directory: packages/mcp
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Build mcp
        run: npm run build:mcp
      - name: Test mcp
        run: npm run test:mcp
      # @cngx/cli ships a generated byte copy of packages/mcp/src/core. The copy
      # check runs before anything that could rewrite the copy, so CI checks the
      # committed tree; build:cli never syncs (cli:sync stays a manual step).
      - name: Install cli dependencies
        run: npm ci
        working-directory: packages/cli
      - name: Check cli core copy
        run: npm run cli:copy-check
      - name: Build cli
        run: npm run build:cli
      - name: Test cli
        run: npm run test:cli
      # vitest strips types, so a spec can drift from the code it tests; this
      # compiles every cli and mcp spec without emitting.
      - name: Type-check cli and mcp specs
        run: npm run typecheck:tooling
      # The engines floor of @cngx/cli is Node 20; the job above runs on .nvmrc,
      # so the built CLI also runs once on the floor itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run cli on Node 20
        run: node packages/cli/dist/index.js --version && node packages/cli/dist/index.js api CngxSelect

  # The cngx consumer plugin is static configuration (marketplace + plugin
  # manifests, a bundled .mcp.json) checked by a plain vitest spec. It has no
  # build step and no package-local dependencies, so unlike eslint-plugin and
  # mcp it runs on the root install alone and declares no needs: build.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate plugin manifests
        run: npm run test:plugin
      # Fail when the committed pack (theming tokens + recipes) has fallen behind
      # its recorded sources - a story or the mcp snapshot changed without a pack
      # regeneration in the same change.
      - name: Check pack drift
        run: npm run plugin:drift

  # The standalone @cngx/doctor package is the canonical home of the project-
  # wiring engine. It is zero-dependency .mjs run through the root vitest, so
  # like the plugin job it needs no build and no package-local install - it runs
  # on the root install alone and declares no needs: build. The copy guard keeps
  # the plugin's in-process copy byte-identical to this package.
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test doctor
        run: npm run test:doctor
      # Assert the plugin's in-process engine copy is byte-identical to this
      # package - the guard that makes "one engine, not two" true, in both
      # divergence directions.
      - name: Check doctor copy
        run: npm run doctor:copy-check
