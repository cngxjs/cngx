name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-

      # Keyed on the lockfile so the cache invalidates when the pinned
      # @playwright/test version changes - the browser build the geometry
      # specs (and the timeline e2e) drive Chromium with.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Build all libraries
        run: npm run build:libs

      - name: Generate compodoc JSON
        run: npm run docs:json

      - name: Generate examples components
        run: npm run examples:generate

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build examples app
        run: npm run build:examples

      # The whole e2e suite is gated below (npm run e2e). The Playwright
      # webServer boots `ng serve examples`; the Build-examples step above has
      # already generated the feature components it serves.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Geometry specs run in the same job as the unit tests - same pipeline,
      # a different environment. CI sets CI=1, so the vitest browser provider
      # runs Chromium headless with no flag. A geometry regression fails the PR.
      - name: Run geometry specs
        run: npm run test:geometry

      # Gate the whole e2e suite on every PR (replaces the single-spec timeline
      # step; the timeline e2e is now one spec in the gated suite). Route-drift
      # specs with no migrated example are test.fixme-quarantined in-file. Three
      # pre-existing flaky specs are excluded here pending triage
      # (CngxContextMenuTrigger dismissal timing, examples-followup document.title
      # races, and the stock Playwright placeholder) - by test-title match.
      - name: e2e suite
        run: npm run e2e -- --project=chromium --grep-invert "CngxContextMenuTrigger|examples followup|has title"
