name: PR Title

# The hard gate. Because PRs are squash-merged, the PR title becomes the single
# commit on main and the changelog line, so it must be a valid Conventional
# Commit. Make this a required check in branch protection for `main`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with commitlint.config.mjs type-enum.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Keep in sync with scripts/changelog-scopes.mjs.
          scopes: |
            utils
            core
            core/theming
            core/i18n
            core/schematics
            core/testing
            common
            common/a11y
            common/audio
            common/command
            common/interactive
            common/display
            common/popover
            common/chart
            common/stepper
            common/tabs
            common/card
            common/dialog
            common/data
            common/layout
            common/timeline
            forms
            forms/controls
            forms/validators
            forms/field
            forms/input
            forms/select
            forms/filter-builder
            select-family
            data-display
            data-display/treetable
            interop
            interop/query
            interop/signals
            ui
            ui/layout
            ui/overlay
            ui/mat-paginator
            ui/paginator
            ui/empty-state
            ui/feedback
            ui/stepper
            ui/mat-stepper
            ui/tabs
            ui/mat-tabs
            ui/accordion
            ui/mat-accordion
            ui/data-grid-accordion
            ui/breadcrumb
            ui/sidenav
            ui/skeleton
            ui/speak
            ui/action-button
            ui/collection
            ui/stat-card
            ui/chart-panel
            ui/timeline
            ui/a11y
            ui/command-palette
            ui/context-menu
            ui/toc
            themes
            themes/material
            examples
            examples-gen
            docs
            ci
            build
            chore
            changelog
            deps
            release
            testing
            scripts
            e2e
            examples/e2e
            eslint-plugin
            mcp
            plugin
            doctor
          requireScope: true
          # Subject must not start with an uppercase letter (imperative, lower case).
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject "{subject}" must start with a lower-case letter
            (imperative mood, no leading capital, no trailing period).

  # A `!` title is a breaking change: it ships an ng update migration (a new
  # key in projects/core/schematics/migrations/migrations.json) or says
  # "Migration: not migratable" in the body. The decision lives in
  # scripts/migration-gate.mjs, unit-tested in scripts/__tests__.
  migration-gate:
    name: Migration gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require a migration for a breaking change
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/migration-gate.mjs
