name: Set up Playwright chromium
description: Restore the cached Playwright browsers and install chromium. Runs after npm ci.

# No system deps: the ubuntu-24.04 image already carries every shared library
# chromium links against (ldd reports none missing), and the apt-get update
# behind the deps install took anywhere from 20 seconds to 9 minutes.
# Workflows pin ubuntu-24.04: ubuntu-latest moved to 26.04, where the pinned
# Playwright refuses to install chromium.
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright chromium
      shell: bash
      run: npx playwright install chromium
