name: Set up Playwright chromium
description: Restore the cached Playwright browsers and install chromium. Runs after npm ci.

# No system deps: the ubuntu-latest image already carries every shared library
# chromium links against (ldd reports none missing), and the apt-get update
# behind the deps install took anywhere from 20 seconds to 9 minutes.
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright chromium
      shell: bash
      run: npx playwright install chromium
