@if (breadcrumb.hasCollapsed()) {
  <button
    cngxIconMenuButton
    size="xs"
    class="cngx-breadcrumb__overflow-trigger"
    [menu]="menu"
    [popover]="panel.popover"
    [aria-label]="resolvedTriggerLabel()"
  >
    <ng-content select=":not([cngxBreadcrumbOverflowItem])">
      <!-- An SVG, not &hellip;: a text ellipsis sits on the baseline, below the box centre. -->
      <svg class="cngx-breadcrumb__overflow-glyph" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="12" r="1.75" />
        <circle cx="12" cy="12" r="1.75" />
        <circle cx="19" cy="12" r="1.75" />
      </svg>
    </ng-content>
  </button>

  <cngx-popover-panel #panel role="group" placement="bottom-start">
    <ul cngxMenu #menu="cngxMenu" [label]="resolvedMenuLabel()" class="cngx-breadcrumb__overflow-menu">
      @for (crumb of breadcrumb.collapsedItems(); track crumb; let i = $index) {
        <li cngxMenuItem class="cngx-breadcrumb__overflow-item">
          @if (itemTemplate(); as tpl) {
            <ng-container
              *ngTemplateOutlet="tpl; context: { $implicit: crumb, crumb: crumb, index: i }"
            />
          } @else {
            {{ crumb.resolvedLabel() }}
          }
        </li>
      }
    </ul>
  </cngx-popover-panel>
}
