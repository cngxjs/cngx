@if (totalSteps() === 0) {
  @let emptyTpl = resolvedEmptyTemplate();
  @if (emptyTpl) {
    <ng-container *ngTemplateOutlet="emptyTpl"></ng-container>
  }
} @else {
  <span class="cngx-text-stepper__text" aria-live="polite">{{ stepText() }}</span>
  @if (stateView.hasAnyError()) {
    <span class="cngx-text-stepper__error" role="status" data-state="error">
      <span class="cngx-text-stepper__error-glyph" aria-hidden="true">{{ errorGlyph }}</span>
      <span class="cngx-text-stepper__error-text">{{ errorText() }}</span>
    </span>
  }
}
