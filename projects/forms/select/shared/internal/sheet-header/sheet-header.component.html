<div
  class="cngx-select-sheet-header__bar"
  cngxSwipeDismiss="down"
  [enabled]="sheet.modal()"
  (swiped)="sheet.requestClose('swipe')"
>
  @if (host.tpl.sheetHandle(); as handleTpl) {
    <div class="cngx-select-sheet-header__handle" aria-hidden="true">
      <ng-container *ngTemplateOutlet="handleTpl; context: handleContext()" />
    </div>
  } @else {
    <span cngxPopoverSheetHandle></span>
  }
  <span cngxPopoverSheetTitle class="cngx-select-sheet-header__title">{{ heading() }}</span>
  @if (host.selectionCount(); as count) {
    <span class="cngx-select-sheet-header__count">
      @if (host.tpl.sheetCount(); as countTpl) {
        <ng-container *ngTemplateOutlet="countTpl; context: { $implicit: count, text: count }" />
      } @else {
        {{ count }}
      }
    </span>
  }
  @if (host.showDone()) {
    <button
      type="button"
      class="cngx-select-sheet-header__done"
      [attr.aria-disabled]="closeDisabled()"
      [attr.aria-describedby]="closeDescribedBy()"
      (click)="handleClose()"
    >
      {{ host.ariaLabels().sheetDone }}
    </button>
  }
  <button
    type="button"
    class="cngx-select-sheet-header__close"
    [attr.aria-label]="host.ariaLabels().sheetClose"
    [attr.aria-disabled]="closeDisabled()"
    [attr.aria-describedby]="closeDescribedBy()"
    (click)="handleClose()"
  >
    <span aria-hidden="true">{{ closeGlyph }}</span>
  </button>
  <span hidden class="cngx-select-sheet-header__pending" [id]="pendingId">{{
    host.ariaLabels().commitPending
  }}</span>
  @if (host.showInput()) {
    <input
      type="search"
      class="cngx-select-sheet-header__input"
      [cngxSelectSheetSearchFocus]="host.searchLeads"
      role="combobox"
      [attr.aria-expanded]="host.panelVisible()"
      aria-autocomplete="list"
      autocomplete="off"
      [attr.aria-labelledby]="titleId()"
      [attr.aria-controls]="host.panelId()"
      [attr.aria-activedescendant]="activeId()"
      [value]="host.searchTerm()"
      (input)="handleInput($event)"
      (keydown)="handleKeydown($event)"
    />
  }
  <ng-content select="cngx-select-search" />
</div>
